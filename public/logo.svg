<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <!-- Marca d'água — Avila Ops Tecnologia -->
  <!-- Uso: inserir em documentos e imagens com opacidade 15–30% -->

  <!-- Ícone "A" -->
  <rect x="0" y="16" width="48" height="48" fill="#2563eb" opacity="0.25"/>
  <text x="24" y="47" font-family="Arial, Helvetica, sans-serif" font-size="26"
        font-weight="900" fill="#ffffff" opacity="0.6"
        text-anchor="middle" letter-spacing="-1">A</text>

  <!-- Nome -->
  <text x="60" y="38" font-family="Arial, Helvetica, sans-serif" font-size="16"
        font-weight="700" fill="#2563eb" opacity="0.35" letter-spacing="-0.3">
    Avila Ops
  </text>

  <!-- Subtítulo -->
  <text x="60" y="56" font-family="Arial, Helvetica, sans-serif" font-size="10"
        font-weight="400" fill="#2563eb" opacity="0.25" letter-spacing="1.5"
        text-transform="uppercase">
    TECNOLOGIA · avilaops.com
  </text>

  <!-- Linha decorativa -->
  <line x1="60" y1="62" x2="220" y2="62" stroke="#2563eb" stroke-width="1" opacity="0.15"/>
</svg>
