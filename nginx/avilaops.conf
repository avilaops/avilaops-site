# Servidor do export estatico do avilaops.com dentro da imagem publicada.
#
# Substitui o default.conf de fabrica do nginx, que servia os arquivos sem
# nenhum cabecalho de seguranca, sem compressao e sem politica de cache.
#
# A lista de cabecalhos nao esta aqui: ela e gerada em
# nginx/security-headers.conf a partir de config/security-headers.mjs, para
# nao viver em duas copias (a outra e o out/_headers do Cloudflare Pages).
#
# Cuidado ao mexer: no nginx, um `add_header` dentro de um `location` descarta
# todos os `add_header` herdados do `server`. Por isso cada location inclui o
# arquivo de seguranca explicitamente, em vez de confiar na heranca.

server {
    # Sem `listen [::]:80` de proposito: em host sem IPv6 o nginx nao sobe
    # ("Address family not supported by protocol") e o container entra em
    # loop de restart. A imagem de fabrica so liga IPv6 porque o entrypoint
    # dela testa antes; aqui a porta v4 basta, o trafego chega por proxy.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Nao anunciar a versao do nginx nas respostas e nas paginas de erro.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    # O _headers so existe para o Cloudflare Pages ler no deploy. Servido por
    # aqui ele seria apenas a politica exposta em texto puro.
    location = /_headers {
        return 404;
    }

    # Tudo em /_next/static/ carrega hash no nome do arquivo: o conteudo
    # daquele endereco nunca muda, entao vale cache longo e imutavel.
    location /_next/static/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|avif|woff|woff2|mp4|webm)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # HTML e o resto. O site usa trailingSlash, entao o $uri/index.html
    # resolve /guias/ e afins; o $uri.html cobre quem chega sem a barra.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        internal;
    }
}
